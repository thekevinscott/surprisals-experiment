name: aws-runner

on:
  pull_request:
    paths: ['packages/aws_runner/**', '.github/workflows/aws-runner.yml']
  push:
    branches: [main]
    paths: ['packages/aws_runner/**', '.github/workflows/aws-runner.yml']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aws_runner
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/aws_runner/src
      gates: '["one-function-per-file"]'
