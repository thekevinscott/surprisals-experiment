name: state-machine

on:
  pull_request:
    paths:
      - 'state_machine/**'
      - '.github/workflows/state-machine.yml'
  push:
    branches: [main]
    paths:
      - 'state_machine/**'
      - '.github/workflows/state-machine.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: state_machine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv run --locked pytest tests/integration
