name: viewer frontend

on:
  pull_request:
    paths:
      - 'packages/transcripts-viewer-frontend/**'
      - '.github/workflows/viewer-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'packages/transcripts-viewer-frontend/**'
      - '.github/workflows/viewer-frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/transcripts-viewer-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
