name: tests

on:
  pull_request:
    paths:
      - 'surprisals_experiment/**'
      - 'state_machine/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'surprisals_experiment/**'
      - 'state_machine/**'
      - '.github/workflows/tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surprisals_experiment
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest src
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surprisals_experiment
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest tests/integration
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: surprisals_experiment/src
      gates: '["e2e-verify", "one-function-per-file"]'
      run_e2e: true
