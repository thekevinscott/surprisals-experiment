[project]
name = "runpod-scorer"
version = "0.1.0"
description = "Start and stop a RunPod vLLM scorer"
requires-python = ">=3.14"
dependencies = ["httpx", "labnotes>=0.0.133", "python-dotenv"]

[project.scripts]
runpod-scorer = "runpod_scorer.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
