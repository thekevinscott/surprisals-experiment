[project]
name = "surprisals-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "botbox>=0.1.1",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "0 seconds"

[dependency-groups]
dev = [
    "dirsql>=0.4.119",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-describe>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
botbox = { git = "https://github.com/thekevinscott/botbox.git", rev = "ed3536e", subdirectory = "packages/python" }
