[project]
name = "surprisals-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "state-machine",
    "dirsql>=0.4.136",
    "botbox>=0.1.75",
    "jinja2>=3.1.6",
    "measure-surprisal>=0.2.0",
    "openai>=3.37.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "labnotes>=0.2.25",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "0 seconds"

[dependency-groups]
dev = [
    "looptime>=0.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-describe>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
asyncio_mode = "auto"

[tool.uv.sources]
state-machine = { path = "../state_machine" }
measure-surprisal = { git = "https://github.com/thekevinscott/measure-surprisal.git", rev = "7f2e0ad64d5d12d821faa68c41d81a9cd8bf54a9" }
botbox = { git = "https://github.com/thekevinscott/botbox.git", subdirectory = "packages/python", rev = "4fed2b153f15e216d9b07109355b83a6d7bdf819" }
