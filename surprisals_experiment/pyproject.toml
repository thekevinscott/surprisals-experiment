authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "botbox>=0.0.15",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
