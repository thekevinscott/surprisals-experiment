from = "surprisals"
name = "Forks testing (AWS)"
setup = "uv run --project runpod_scorer runpod-scorer up"
command = "uv run --project packages/aws_runner aws_runner run {run_dir} -- uv run --directory surprisals_experiment python -m surprisals_experiment.cli.run --output {run_dir} ../data/APPS/test/2286"
teardown = "uv run --project runpod_scorer runpod-scorer down"
repeats = 1
continues = true
concurrency = 2

[params]
cap-strategy = ["characters", "surprisal"]
