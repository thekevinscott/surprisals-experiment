name = "Surprisal"
setup = "uv run --project runpod_scorer runpod-scorer up"
command = """runpod_scorer/run-cell.sh uv run --project packages/aws_runner aws_runner run {run_dir} -- uv run --directory surprisals_experiment python -m surprisals_experiment.cli.run \
  --output {run_dir} \
  -U xiaomi/mimo-v2.6-pro \
  -T openai/gpt-oss-120b \
  --u-thinking high \
  --t-samples 5 \
  --t-pool-size 3 \
  --t-sample-timeout 300 \
  --t-sample-retries 0 \
  --max-u-turns 40 \
  --window-forks 4 \
  --fork-turns 10 \
  --window-solo-turns 30"""
teardown = "uv run --project runpod_scorer runpod-scorer down"
repeats = 1
continues = true
concurrency = 8

# The 50 problems Mimo passed 5/5 in t-baseline-mimo run 20261110-040325.
