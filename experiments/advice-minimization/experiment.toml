  --directory surprisals_experiment \
  python -m surprisals_experiment.cli.run \
  -U xiaomi/mimo-v2.6-pro \
  -T openai/gpt-oss-120b \
  --u-thinking high \
  --max-turns-without-improvement 30 \
  --output "{run_dir}" \
