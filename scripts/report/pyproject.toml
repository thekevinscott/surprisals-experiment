[project]
name = "report"
version = "0.1.0"
description = "Summarize advice and T attempts in a run folder"
requires-python = ">=3.14"
dependencies = ["run-database"]

[project.scripts]
report = "report:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
run-database = { path = "../../packages/run_database", editable = true }
