[project]
name = "report"
version = "0.1.0"
description = "Summarize advice and T attempts in a run folder"
requires-python = ">=3.14"
dependencies = ["run-database"]

[project.scripts]
report = "report:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
run-database = { path = "../../packages/run_database", editable = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
