name = "Surprisal experiment: U to T"
command = '''
uv run \
  --directory surprisals_experiment \
  surprisals_experiment \
  -U xiaomi/mimo-v2.6-pro \
  -T openai/gpt-oss-120b \
  --u-thinking high \
  --max-u-turns 5 \
  --output "{run_dir}" \
  problem'''
repeats = 1
mode = "adhoc"

[params]
problem-dir = ["../data/APPS/test/2286"]
# Exclusive character bounds; overlong advice is rewritten before T runs.
u-advice-max-chars = [100]
