[project]
name = "aws-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.scripts]
aws_runner = "aws_runner.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "moto[ec2]>=5", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
python_files = ["*_test.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
